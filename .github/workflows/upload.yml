name: Build and Upload SDK
permissions: {}

on:
  push:
    branches:
      - latest
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@4c598a2d8f7b6abd283eba15ec7a9fda8ba76318 # main
    with:
      # XXX: no native runners for non-amd64
      # platforms: '["amd64","arm64","ppc64el","s390x","riscv64"]'
      platforms: '["amd64"]'
      platform-flag: "--build-for"
      runs-on: '["ubuntu-latest"]'
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
